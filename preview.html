<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>커리큘럼 그래프 초안 — 체크포인트 C</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Malgun Gothic', sans-serif; background: #1a1a2e; color: #eee; display: flex; height: 100vh; overflow: hidden; }

#sidebar {
  width: 320px; min-width: 320px;
  background: #16213e;
  display: flex; flex-direction: column;
  border-right: 1px solid #0f3460;
}

#sidebar-header {
  padding: 16px;
  background: #0f3460;
  border-bottom: 1px solid #1a1a2e;
}
#sidebar-header h2 { font-size: 14px; margin-bottom: 6px; color: #e94560; }
#sidebar-header p  { font-size: 11px; color: #aaa; }

#legend { padding: 12px 16px; border-bottom: 1px solid #0f3460; }
#legend h3 { font-size: 11px; color: #888; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
.legend-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; font-size: 11px; }
.legend-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
.legend-edge { width: 24px; height: 3px; flex-shrink: 0; }

#filters { padding: 12px 16px; border-bottom: 1px solid #0f3460; }
#filters h3 { font-size: 11px; color: #888; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
.filter-btn {
  display: inline-block; margin: 2px; padding: 4px 10px;
  border: 1px solid #0f3460; border-radius: 12px;
  font-size: 11px; cursor: pointer; color: #ccc; background: transparent;
  transition: all 0.2s;
}
.filter-btn.active { background: #0f3460; color: #fff; border-color: #e94560; }
.filter-btn:hover { border-color: #e94560; }

#info-panel {
  flex: 1; overflow-y: auto; padding: 16px;
}
#info-panel h3 { font-size: 13px; color: #e94560; margin-bottom: 12px; }
#node-detail { font-size: 12px; }
.detail-row { margin-bottom: 8px; }
.detail-label { color: #888; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
.detail-value { color: #ddd; line-height: 1.5; }
.badge {
  display: inline-block; padding: 2px 8px; border-radius: 10px;
  font-size: 10px; font-weight: bold; margin: 2px;
}
.badge-합의       { background: #1b5e20; color: #a5d6a7; }
.badge-hr_field_override { background: #4a148c; color: #e1bee7; }
.badge-field_override    { background: #e65100; color: #ffe0b2; }
.badge-edu_override      { background: #0d47a1; color: #bbdefb; }
.badge-covered           { background: #1b5e20; color: #a5d6a7; }
.badge-job_market_gap    { background: #bf360c; color: #ffccbc; }
.badge-leading_signal    { background: #4a148c; color: #e1bee7; }
.badge-not_covered       { background: #424242; color: #bdbdbd; }

#cy-wrap { flex: 1; position: relative; }
#cy { width: 100%; height: 100%; }

#toolbar {
  position: absolute; top: 12px; right: 12px;
  display: flex; flex-direction: column; gap: 6px; z-index: 10;
}
.tool-btn {
  padding: 8px 14px; border-radius: 6px;
  background: #16213e; border: 1px solid #0f3460;
  color: #ccc; font-size: 12px; cursor: pointer;
  transition: all 0.2s;
}
.tool-btn:hover { background: #0f3460; color: #fff; }

#stats {
  position: absolute; bottom: 12px; left: 12px;
  background: rgba(22,33,62,0.9); border: 1px solid #0f3460;
  border-radius: 8px; padding: 10px 14px; font-size: 11px; color: #aaa;
  z-index: 10;
}
#stats span { color: #e94560; font-weight: bold; }

.hint { font-size: 10px; color: #666; padding: 8px 16px; border-top: 1px solid #0f3460; text-align: center; }
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <h2>커리큘럼 그래프 초안</h2>
    <p>체크포인트 C — 노드를 클릭하면 근거 데이터 확인</p>
  </div>

  <div id="legend">
    <h3>난이도 레벨</h3>
    <div class="legend-row"><div class="legend-dot" style="background:#4CAF50"></div>L1 입문</div>
    <div class="legend-row"><div class="legend-dot" style="background:#2196F3"></div>L2 초급</div>
    <div class="legend-row"><div class="legend-dot" style="background:#FF9800"></div>L3 중급</div>
    <div class="legend-row"><div class="legend-dot" style="background:#E91E63"></div>L4 고급</div>
    <h3 style="margin-top:10px">NCS 커버</h3>
    <div class="legend-row"><div class="legend-dot" style="background:#555;border:2px solid #555"></div>NCS 등재</div>
    <div class="legend-row"><div class="legend-dot" style="background:#555;border:2px solid #FF5722"></div>job_market_gap</div>
    <div class="legend-row"><div class="legend-dot" style="background:#555;border:2px solid #9C27B0"></div>leading_signal</div>
    <div class="legend-row"><div class="legend-dot" style="background:#555;border:2px solid #9E9E9E"></div>NCS 미등재</div>
    <h3 style="margin-top:10px">엣지</h3>
    <div class="legend-row"><div class="legend-edge" style="background:#aaa"></div>prerequisite (필수 선수)</div>
    <div class="legend-row"><div class="legend-edge" style="background:#aaa;height:1px;border-top:2px dashed #666"></div>recommended (권장)</div>
  </div>

  <div id="filters">
    <h3>레벨 필터</h3>
    <button class="filter-btn active" onclick="filterLevel(0)">전체</button>
    <button class="filter-btn" onclick="filterLevel(1)">L1 입문</button>
    <button class="filter-btn" onclick="filterLevel(2)">L2 초급</button>
    <button class="filter-btn" onclick="filterLevel(3)">L3 중급</button>
    <button class="filter-btn" onclick="filterLevel(4)">L4 고급</button>
  </div>

  <div id="info-panel">
    <h3>노드 상세</h3>
    <div id="node-detail" style="color:#666;font-size:12px">노드를 클릭하면 데이터 근거를 확인할 수 있습니다.</div>
  </div>
  <div class="hint">노드 드래그 · 휠 확대/축소 · 배경 드래그로 이동</div>
</div>

<div id="cy-wrap">
  <div id="cy"></div>
  <div id="toolbar">
    <button class="tool-btn" onclick="cy.fit()">전체 보기</button>
    <button class="tool-btn" onclick="resetLayout()">레이아웃 재정렬</button>
  </div>
  <div id="stats">

  </div>
</div>

let cy;

function initCy(elements) {
  cy = cytoscape({
    container: document.getElementById('cy'),
    elements: elements,
    style: [
      {
        selector: 'node',
        style: {
          'background-color': 'data(color)',
          'border-color': 'data(border)',
          'border-width': 3,
          'label': 'data(label)',
          'color': '#fff',
          'font-size': '11px',
          'text-wrap': 'wrap',
          'text-max-width': '120px',
          'text-valign': 'center',
          'text-halign': 'center',
          'width': function(ele){ return 30 + ele.data('importance') * 50; },
          'height': function(ele){ return 30 + ele.data('importance') * 50; },
          'text-outline-color': '#000',
          'text-outline-width': 1,
          'transition-property': 'background-color, border-width',
          'transition-duration': '0.2s'
        }
      },
      {
        selector: 'node:selected',
        style: { 'border-width': 5, 'border-color': '#FFD700' }
      },
      {
        selector: 'edge',
        style: {
          'width': function(e){ return e.data('strength') * 3; },
          'line-color': 'data(line_color)',
          'line-style': 'data(line_style)',
          'target-arrow-color': 'data(line_color)',
          'target-arrow-shape': 'triangle',
          'curve-style': 'bezier',
          'opacity': 0.7
        }
      },
      {
        selector: 'edge:selected',
        style: { 'opacity': 1, 'line-color': '#FFD700', 'target-arrow-color': '#FFD700' }
      },
      {
        selector: '.faded',
        style: { 'opacity': 0.15 }
      }
    ],
    layout: {
      name: 'breadthfirst',
      directed: true,
      padding: 40,
      spacingFactor: 1.4,
      roots: '#node-001, #node-002, #node-003, #node-004, #node-005'
    },
    wheelSensitivity: 0.3
  });

  document.getElementById('stat-nodes').textContent = cy.nodes().length;
  document.getElementById('stat-edges').textContent = cy.edges().length;
  document.getElementById('stat-prereq').textContent = cy.edges('[relation="prerequisite"]').length;

  cy.on('tap', 'node', function(e) {
    const d = e.target.data();
    showNodeDetail(d);
    cy.elements().addClass('faded');
    e.target.removeClass('faded');
    e.target.neighborhood().removeClass('faded');
    e.target.connectedEdges().removeClass('faded');
  });

  cy.on('tap', function(e) {
    if (e.target === cy) {
      cy.elements().removeClass('faded');
      document.getElementById('node-detail').innerHTML = '<span style="color:#666">노드를 클릭하면 데이터 근거를 확인할 수 있습니다.</span>';
    }
  });
}

function showNodeDetail(d) {
  const consensusBadge = `<span class="badge badge-${d.consensus}">${d.consensus}</span>`;
  const coverageBadge = `<span class="badge badge-${d.ncs_coverage}">${d.ncs_coverage}</span>`;

  document.getElementById('node-detail').innerHTML = `
    <div class="detail-row">
      <div class="detail-label">노드</div>
      <div class="detail-value" style="font-weight:bold;color:#FFD700">${d.label}</div>
    </div>
    <div class="detail-row">
      <div class="detail-label">레벨 / 시간</div>
      <div class="detail-value">L${d.level} ${d.difficulty} / ${d.duration_hours}h</div>
    </div>
    <div class="detail-row">
      <div class="detail-label">합의 / NCS 커버</div>
      <div class="detail-value">${consensusBadge} ${coverageBadge}</div>
    </div>
    <div class="detail-row">
      <div class="detail-label">Work24 빈도</div>
      <div class="detail-value">${d.work24_freq}</div>
    </div>
    <div class="detail-row">
      <div class="detail-label">O*NET IM</div>
      <div class="detail-value">${d.onet_im}</div>
    </div>
    <div class="detail-row">
      <div class="detail-label">PyPI 월간 다운로드</div>
      <div class="detail-value">${d.pypi_monthly}</div>
    </div>
    <div class="detail-row">
      <div class="detail-label">GitHub Stars</div>
      <div class="detail-value">${d.github_stars}</div>
    </div>
    <div class="detail-row">
      <div class="detail-label">HF Daily Papers</div>
      <div class="detail-value">${d.hf_papers}</div>
    </div>
    <div class="detail-row">
      <div class="detail-label">근거 노트</div>
      <div class="detail-value" style="color:#bbb;font-size:11px">${d.note}</div>
    </div>
  `;
}

function filterLevel(level) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');

  if (level === 0) {
    cy.elements().removeClass('faded');
  } else {
    cy.nodes().addClass('faded');
    cy.edges().addClass('faded');
    const targets = cy.nodes(`[level = ${level}]`);
    targets.removeClass('faded');
    targets.connectedEdges().removeClass('faded');
  }
}

function resetLayout() {
  cy.layout({
    name: 'breadthfirst',
    directed: true,
    padding: 40,
    spacingFactor: 1.4,
    roots: '#node-001, #node-002, #node-003, #node-004, #node-005'
  }).run();
}

initCy(ELEMENTS);
</script>
</body>
</html>
